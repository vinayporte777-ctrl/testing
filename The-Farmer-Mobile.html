<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2e7d32" />
  <title>V The Farmer</title>
  <style>
    :root {
      --bg: #f4f8f1;
      --card: #ffffff;
      --text: #1b2a1b;
      --muted: #6b7a6b;
      --primary: #2e7d32;
      --primary-soft: #e8f5e9;
      --border: #dfe8df;
      --danger: #c62828;
      --shadow: 0 10px 20px rgba(0,0,0,0.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
      padding-bottom: calc(84px + env(safe-area-inset-bottom));
    }

    img { max-width: 100%; display: block; }

    a { color: inherit; text-decoration: none; }

    button, input, select, textarea {
      font: inherit;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: linear-gradient(135deg, #2e7d32, #4caf50);
      color: white;
      padding: max(12px, env(safe-area-inset-top)) 16px 12px;
      box-shadow: var(--shadow);
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 760px;
      margin: 0 auto;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(255,255,255,0.2);
      display: grid;
      place-items: center;
      font-size: 24px;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.1rem;
      line-height: 1.1;
    }

    .brand small {
      display: block;
      opacity: 0.9;
      font-size: 0.72rem;
      margin-top: 2px;
    }

    .status {
      margin-left: auto;
      font-size: 0.76rem;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 6px 10px;
      border-radius: 999px;
    }

    .container {
      max-width: 760px;
      margin: 12px auto 0;
      padding: 0 12px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      margin-bottom: 12px;
    }

    .hero {
      padding: 14px;
      background: linear-gradient(180deg, #f6fff7, #eefaf0);
    }

    .hero h2 {
      margin: 0 0 6px;
      font-size: 1.35rem;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      font-size: 0.93rem;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-top: 12px;
    }

    .search-box input {
      flex: 1;
      border: 0;
      padding: 12px 14px;
      font-size: 0.96rem;
      background: transparent;
      color: var(--text);
      outline: none;
    }

    .search-box button {
      border: 0;
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 700;
      padding: 12px 14px;
      cursor: pointer;
    }

    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 14px 0;
      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar { display: none; }

    .chip {
      white-space: nowrap;
      border: 1px solid var(--border);
      background: white;
      color: var(--text);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .chip.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .products {
      display: grid;
      gap: 12px;
      padding: 12px 14px 14px;
    }

    .product {
      display: flex;
      gap: 12px;
      padding: 12px;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 16px;
    }

    .product img {
      width: 96px;
      height: 96px;
      min-width: 96px;
      object-fit: cover;
      border-radius: 12px;
      background: linear-gradient(135deg, #edf7ee, #e8f5e9);
    }

    .product-info {
      flex: 1;
      min-width: 0;
    }

    .product-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .product h3 {
      margin: 0;
      font-size: 1rem;
      word-break: break-word;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      border: 1px solid transparent;
    }

    .badge.a { background: #e8f5e9; color: #1b5e20; }
    .badge.b { background: #fff8e1; color: #8a6d00; }
    .badge.c { background: #fff3e0; color: #e65100; }

    .meta {
      color: var(--muted);
      font-size: 0.76rem;
      margin-top: 5px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .meta span { white-space: nowrap; }

    .desc {
      margin: 8px 0 0;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .price-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
    }

    .price {
      font-weight: 800;
      color: var(--primary);
      font-size: 1.02rem;
    }

    .add-btn, .primary-btn, .ghost-btn, .danger-btn {
      border: none;
      border-radius: 11px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .add-btn:active, .primary-btn:active, .ghost-btn:active, .danger-btn:active {
      transform: translateY(1px);
    }

    .add-btn, .primary-btn {
      background: var(--primary);
      color: white;
    }

    .ghost-btn {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .danger-btn {
      background: #ffeaea;
      color: var(--danger);
    }

    .cart-bar {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom));
      max-width: 760px;
      margin: 0 auto;
      background: rgba(255,255,255,0.96);
      border: 1px solid var(--border);
      backdrop-filter: blur(8px);
      border-radius: 18px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      z-index: 40;
    }

    .cart-details {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .cart-total {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--primary);
      display: block;
    }

    .sheet {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 15, 0.36);
      display: none;
      z-index: 50;
      padding: 16px;
      align-items: flex-end;
      justify-content: center;
    }

    .sheet.open {
      display: flex;
    }

    .sheet-panel {
      width: min(760px, 100%);
      max-height: 88vh;
      overflow: auto;
      background: white;
      border-radius: 22px 22px 12px 12px;
      padding: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .sheet-header h3 {
      margin: 0;
      font-size: 1.2rem;
    }

    .close-btn {
      border: none;
      background: transparent;
      font-size: 1.6rem;
      color: var(--muted);
      cursor: pointer;
    }

    .cart-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .cart-item-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .cart-item-title {
      font-weight: 700;
      word-break: break-word;
    }

    .qty-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .stepper {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: white;
    }

    .stepper button {
      width: 30px;
      height: 30px;
      border: none;
      background: #f7f9f7;
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
    }

    .stepper span {
      min-width: 34px;
      text-align: center;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .order-form {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .order-form input, .order-form textarea, .order-form select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 12px;
      background: #fafcf9;
      color: var(--text);
      outline: none;
    }

    .order-form textarea {
      min-height: 80px;
      resize: vertical;
    }

    .total-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-top: 1px solid var(--border);
      margin-top: 12px;
      font-size: 1.02rem;
      font-weight: 800;
    }

    .cta-row {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .cta-row > * { flex: 1; }

    .empty {
      padding: 18px 14px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .msg {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      background: #eefaf0;
      color: var(--primary);
      display: none;
    }

    .msg.show { display: block; }

    @media (min-width: 640px) {
      .products { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo">🥬</div>
      <div class="brand">
        <h1>V The Farmer</h1>
        <small>ताज़ा सब्ज़ियाँ • घर तक</small>
      </div>
      <div class="status" id="statusText">ऑनलाइन</div>
    </div>
  </header>

  <main class="container">
    <section class="card hero">
      <h2>आज की सब्ज़ियाँ</h2>
      <p>ताज़ा, भरोसेमंद और फोन पर आसान ऑर्डर।</p>
      <div class="search-box">
        <input id="searchInput" type="text" placeholder="सब्ज़ी/नाम ढूँढें..." />
        <button id="searchBtn">खोजें</button>
      </div>
    </section>

    <section class="card" id="filterWrap">
      <div class="filters" id="filters"></div>
    </section>

    <section id="productList" class="products"></section>
  </main>

  <div class="cart-bar" id="cartBar">
    <div>
      <span class="cart-details" id="cartCount">0 आइटम</span>
      <span class="cart-total" id="cartTotal">₹ 0</span>
    </div>
    <button class="primary-btn" id="openCartBtn">कार्ट देखें</button>
  </div>

  <div class="sheet" id="cartSheet">
    <div class="sheet-panel">
      <div class="sheet-header">
        <h3>आपका कार्ट</h3>
        <button class="close-btn" id="closeSheetBtn" aria-label="close">×</button>
      </div>
      <div id="cartItems"></div>
      <div id="emptyCart" class="empty">अभी कार्ट खाली है।</div>

      <div class="order-form">
        <input id="customerName" type="text" placeholder="नाम" />
        <input id="customerPhone" type="tel" placeholder="मोबाइल नंबर" />
        <textarea id="customerAddress" placeholder="पता"></textarea>
        <select id="paymentMode">
          <option value="कैश ऑन डिलीवरी">कैश ऑन डिलीवरी</option>
          <option value="UPI">UPI</option>
          <option value="नेट बैंकिंग">नेट बैंकिंग</option>
        </select>
      </div>

      <div class="total-box">
        <span>कुल</span>
        <span id="sheetTotal">₹ 0</span>
      </div>

      <div class="cta-row">
        <button class="ghost-btn" id="clearCartBtn">साफ करें</button>
        <button class="primary-btn" id="placeOrderBtn">ऑर्डर भेजें</button>
      </div>

      <div id="orderMsg" class="msg"></div>
    </div>
  </div>

  <script>
    const products = [
      { id: 1, name: 'टमाटर', category: 'सब्ज़ियाँ', grade: 'A', price: 35, unit: 'kg', stock: 'ताज़ा', origin: 'स्थानीय', image: 'https://images.unsplash.com/photo-1546094096-0df4bcaaa337?auto=format&fit=crop&w=900&q=80', desc: 'रंगीन, स्वादिष्ट और ताज़ा' },
      { id: 2, name: 'प्याज़', category: 'सब्ज़ियाँ', grade: 'A', price: 28, unit: 'kg', stock: 'ताज़ा', origin: 'स्थानीय', image: 'https://images.unsplash.com/photo-1502741338009-cac2772e18bc?auto=format&fit=crop&w=900&q=80', desc: 'साफ़ और स्वादिष्ट' },
      { id: 3, name: 'लहसुन', category: 'सब्ज़ियाँ', grade: 'B', price: 120, unit: 'kg', stock: 'ताज़ा', origin: 'स्थानीय', image: 'https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=900&q=80', desc: 'घरेलू फार्म से' },
      { id: 4, name: 'अदरक', category: 'सब्ज़ियाँ', grade: 'A', price: 90, unit: 'kg', stock: 'ताज़ा', origin: 'स्थानीय', image: 'https://images.unsplash.com/photo-1522184216316-3c25f7f1d0c6?auto=format&fit=crop&w=900&q=80', desc: 'स्वाद और फ़ायदा' },
      { id: 5, name: 'खीरा', category: 'सब्ज़ियाँ', grade: 'A', price: 25, unit: 'kg', stock: 'ताज़ा', origin: 'स्थानीय', image: 'https://images.unsplash.com/photo-1449300076603-7d7f0d75a2e8?auto=format&fit=crop&w=900&q=80', desc: 'ताज़ा और कड़क' },
      { id: 6, name: 'पालक', category: 'हरे पत्ते', grade: 'A', price: 22, unit: 'bunch', stock: 'ताज़ा', origin: 'स्थानीय', image: 'https://images.unsplash.com/photo-1576045057995-568f588f82fb?auto=format&fit=crop&w=900&q=80', desc: 'स्वस्थ और ताज़ा' },
      { id: 7, name: 'धनिया', category: 'हरी सब्ज़ियाँ', grade: 'A', price: 18, unit: 'bunch', stock: 'ताज़ा', origin: 'स्थानीय', image: 'https://images.unsplash.com/photo-1615485290382-441e4d049cb5?auto=format&fit=crop&w=900&q=80', desc: 'ताज़ा कलीय' },
      { id: 8, name: 'मिर्च', category: 'सब्ज़ियाँ', grade: 'B', price: 60, unit: 'kg', stock: 'ताज़ा', origin: 'स्थानीय', image: 'https://images.unsplash.com/photo-1592841200221-7e6d7d14f0f9?auto=format&fit=crop&w=900&q=80', desc: 'स्वाद और रंग' },
      { id: 9, name: 'बैंगन', category: 'सब्ज़ियाँ', grade: 'A', price: 40, unit: 'kg', stock: 'ताज़ा', origin: 'स्थानीय', image: 'https://images.unsplash.com/photo-1598170845058-32b9d6a5da37?auto=format&fit=crop&w=900&q=80', desc: 'साफ़ और ताज़ा' },
      { id: 10, name: 'कद्दू', category: 'सब्ज़ियाँ', grade: 'C', price: 32, unit: 'kg', stock: 'सामान्य', origin: 'स्थानीय', image: 'https://images.unsplash.com/photo-1570586437263-ab629fccc818?auto=format&fit=crop&w=900&q=80', desc: 'किफायती और पौष्टिक' }
    ];

    let cart = JSON.parse(localStorage.getItem('farmerCart') || '{}');
    let activeCategory = 'सभी';
    let searchTerm = '';

    const categories = ['सभी', ...new Set(products.map(item => item.category))];

    const productList = document.getElementById('productList');
    const filters = document.getElementById('filters');
    const searchInput = document.getElementById('searchInput');
    const cartCount = document.getElementById('cartCount');
    const cartTotal = document.getElementById('cartTotal');
    const cartSheet = document.getElementById('cartSheet');
    const cartItems = document.getElementById('cartItems');
    const emptyCart = document.getElementById('emptyCart');
    const sheetTotal = document.getElementById('sheetTotal');
    const orderMsg = document.getElementById('orderMsg');

    function saveCart() {
      localStorage.setItem('farmerCart', JSON.stringify(cart));
    }

    function formatMoney(value) {
      return '₹ ' + Number(value).toLocaleString('en-IN');
    }

    function getCartItemCount() {
      return Object.values(cart).reduce((sum, qty) => sum + Number(qty), 0);
    }

    function getCartTotal() {
      let total = 0;
      Object.entries(cart).forEach(([id, qty]) => {
        const item = products.find(product => product.id === Number(id));
        if (item) total += Number(qty) * Number(item.price);
      });
      return total;
    }

    function renderFilters() {
      filters.innerHTML = categories.map(cat => {
        const active = cat === activeCategory ? 'active' : '';
        return `<button class="chip ${active}" data-category="${cat}">${cat}</button>`;
      }).join('');
    }

    function renderProducts() {
      const filtered = products.filter(item => {
        const matchesCategory = activeCategory === 'सभी' || item.category === activeCategory;
        const matchesSearch = item.name.toLowerCase().includes(searchTerm.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      if (!filtered.length) {
        productList.innerHTML = '<div class="card" style="padding:18px 16px; text-align:center; color: var(--muted);">कोई चीज़ नहीं मिली।</div>';
        return;
      }

      productList.innerHTML = filtered.map(item => {
        const qty = cart[item.id] || 0;
        return `
          <article class="product">
            <img src="${item.image}" alt="${item.name}" />
            <div class="product-info">
              <div class="product-top">
                <h3>${item.name}</h3>
                <span class="badge ${item.grade.toLowerCase()}">${item.grade} ग्रेड</span>
              </div>
              <div class="meta">
                <span>${item.category}</span>
                <span>•</span>
                <span>${item.stock}</span>
                <span>•</span>
                <span>${item.origin}</span>
              </div>
              <p class="desc">${item.desc}</p>
              <div class="price-row">
                <span class="price">${formatMoney(item.price)} / ${item.unit}</span>
                <button class="add-btn" data-add="${item.id}">${qty ? 'अभी जोड़ें' : 'कार्ट में डालें'}</button>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function renderCart() {
      const entries = Object.entries(cart);
      const total = getCartTotal();

      cartCount.textContent = `${getCartItemCount()} आइटम`;
      cartTotal.textContent = formatMoney(total);
      sheetTotal.textContent = formatMoney(total);

      if (!entries.length) {
        cartItems.innerHTML = '';
        emptyCart.style.display = 'block';
        return;
      }

      emptyCart.style.display = 'none';
      cartItems.innerHTML = entries.map(([id, qty]) => {
        const item = products.find(p => p.id === Number(id));
        if (!item) return '';
        const price = Number(item.price) * Number(qty);
        return `
          <div class="cart-item">
            <div class="cart-item-info">
              <span class="cart-item-title">${item.name}</span>
              <span style="color: var(--muted); font-size: 0.8rem;">${formatMoney(item.price)} / ${item.unit}</span>
              <span style="color: var(--primary); font-weight: 700; font-size: 0.9rem;">${formatMoney(price)}</span>
            </div>
            <div class="qty-row">
              <div class="stepper">
                <button data-dec="${id}">−</button>
                <span>${qty}</span>
                <button data-inc="${id}">+</button>
              </div>
              <button class="danger-btn" data-remove="${id}">हट���एँ</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function openCart() {
      renderCart();
      cartSheet.classList.add('open');
    }

    function closeCart() {
      cartSheet.classList.remove('open');
    }

    function addToCart(id) {
      const productId = Number(id);
      cart[productId] = (cart[productId] || 0) + 1;
      saveCart();
      renderProducts();
      renderCart();
    }

    function removeFromCart(id) {
      delete cart[id];
      saveCart();
      renderProducts();
      renderCart();
    }

    function changeQty(id, delta) {
      const productId = Number(id);
      const nextQty = (cart[productId] || 0) + delta;
      if (nextQty <= 0) {
        delete cart[productId];
      } else {
        cart[productId] = nextQty;
      }
      saveCart();
      renderProducts();
      renderCart();
    }

    function placeOrder() {
      const name = document.getElementById('customerName').value.trim();
      const phone = document.getElementById('customerPhone').value.trim();
      const address = document.getElementById('customerAddress').value.trim();
      const payment = document.getElementById('paymentMode').value;

      if (!name || !phone || !address) {
        orderMsg.textContent = 'कृपया नाम, मोबाइल और पता भरें।';
        orderMsg.classList.add('show');
        return;
      }

      if (Object.keys(cart).length === 0) {
        orderMsg.textContent = 'कार्ट खाली है।';
        orderMsg.classList.add('show');
        return;
      }

      let message = 'नमस्ते V The Farmer,%0A';
      message += `नाम: ${name}%0A`;
      message += `मोबाइल: ${phone}%0A`;
      message += `पता: ${address}%0A`;
      message += `भुगतान: ${payment}%0A%0A`;
      message += 'ऑर्डर:%0A';

      Object.entries(cart).forEach(([id, qty]) => {
        const item = products.find(p => p.id === Number(id));
        if (!item) return;
        message += `- ${item.name}: ${qty} ${item.unit} = ${formatMoney(Number(qty) * Number(item.price)).replace(/\s/g, '')}%0A`;
      });

      message += `%0Aकुल: ${formatMoney(getCartTotal()).replace(/\s/g, '')}`;

      const waLink = `https://wa.me/919165552744?text=${message}`;
      window.open(waLink, '_blank');

      orderMsg.textContent = 'WhatsApp पर ऑर्डर भेज दिया गया है।';
      orderMsg.classList.add('show');
      cart = {};
      saveCart();
      renderProducts();
      renderCart();
      document.getElementById('customerName').value = '';
      document.getElementById('customerPhone').value = '';
      document.getElementById('customerAddress').value = '';
    }

    document.getElementById('searchBtn').addEventListener('click', () => {
      searchTerm = searchInput.value.trim();
      renderProducts();
    });

    searchInput.addEventListener('input', (event) => {
      searchTerm = event.target.value.trim();
      renderProducts();
    });

    document.getElementById('filters').addEventListener('click', (event) => {
      const btn = event.target.closest('[data-category]');
      if (!btn) return;
      activeCategory = btn.dataset.category;
      renderFilters();
      renderProducts();
    });

    document.getElementById('productList').addEventListener('click', (event) => {
      const btn = event.target.closest('[data-add]');
      if (!btn) return;
      addToCart(btn.dataset.add);
    });

    document.getElementById('openCartBtn').addEventListener('click', openCart);
    document.getElementById('closeSheetBtn').addEventListener('click', closeCart);

    document.getElementById('cartItems').addEventListener('click', (event) => {
      const incBtn = event.target.closest('[data-inc]');
      const decBtn = event.target.closest('[data-dec]');
      const removeBtn = event.target.closest('[data-remove]');

      if (incBtn) changeQty(incBtn.dataset.inc, 1);
      if (decBtn) changeQty(decBtn.dataset.dec, -1);
      if (removeBtn) removeFromCart(removeBtn.dataset.remove);
    });

    document.getElementById('clearCartBtn').addEventListener('click', () => {
      cart = {};
      saveCart();
      renderProducts();
      renderCart();
      orderMsg.classList.remove('show');
    });

    document.getElementById('placeOrderBtn').addEventListener('click', placeOrder);

    renderFilters();
    renderProducts();
    renderCart();
  </script>
</body>
</html>
